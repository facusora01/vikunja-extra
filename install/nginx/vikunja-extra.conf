# Proxy delante de Vikunja que inyecta el script propio en el HTML.
#
# Este archivo es la FUENTE DE VERDAD de la config. Antes el vhost se armaba
# por parches: install-extra.sh escribia un heredoc e install-ws.sh le metia
# los location de /ws y /mcp con awk y sed. Resultado: la unica copia completa
# vivia en el servidor y no habia forma de revisarla en un diff. Ahora se
# instala entero de una vez y se versiona aca.
#
# __VERSION__ lo reemplaza install/aplicar.sh por el SHA del commit desplegado.
server {
    listen 127.0.0.1:8080;
    server_name _;

    client_max_body_size 25m;

    location /_extra/ws {
        proxy_pass http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /_extra/mcp {
        proxy_pass http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /_extra/ {
        alias /var/www/vikunja-extra/;
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre (index-DrSaSglU.js): el contenido no puede
    # cambiar sin que cambie el nombre, asi que se cachean un anio.
    #
    # Sin este bloque el upstream manda `max-age=0, must-revalidate` sobre los
    # 226 archivos del precache del service worker, y el navegador sale a
    # revalidarlos TODOS en cada carga: 226 respuestas 304 de ~330 ms cada una.
    # Se veia como si la pagina se recargara sola y quedara congelada.
    #
    # Aca tampoco se limpia Accept-Encoding: sub_filter solo trabaja sobre HTML
    # (sub_filter_types es text/html por defecto), asi que limpiarlo en este
    # location solo servia para que los JS y CSS viajaran sin comprimir. El
    # bundle principal pasa de 315 KB a 108 KB.
    location /assets/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # sub_filter no puede trabajar sobre respuestas comprimidas
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;

        sub_filter '</head>' '<script src="/_extra/extra.js?v=__VERSION__"></script></head>';
        sub_filter_once on;
    }
}
